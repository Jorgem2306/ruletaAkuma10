<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akuma 30 | Pre-Birthday Stream - Ruleta</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Permanent+Marker&family=Sedgwick+Ave+Display&family=Rock+Salt&family=Finger+Paint&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Canvas de Confeti en pantalla completa -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Luces y Efectos de Fondo con tonos Sunset, Océano y Arena -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>

    <div class="app-wrapper">
        <!-- Encabezado -->
        <header class="app-header">
            <div class="brand">
                    <h1 class="wave-title" aria-label="PRE-BIRTHDAY">
                        <span style="--i:0">P</span><span style="--i:1">R</span><span style="--i:2">E</span><span style="--i:3">-</span><span style="--i:4">B</span><span style="--i:5">I</span><span style="--i:6">R</span><span style="--i:7">T</span><span style="--i:8">H</span><span style="--i:9">D</span><span style="--i:10">A</span><span style="--i:11">Y</span>
                    </h1>
            </div>

            <div class="header-actions">
                <div class="volume-control-wrapper">
                    <button id="sound-btn" class="icon-btn" title="Silenciar / Activar Sonido">
                        <svg id="sound-icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        </svg>
                        <svg id="sound-icon-off" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <line x1="23" y1="9" x2="17" y2="15"></line>
                            <line x1="17" y1="9" x2="23" y2="15"></line>
                        </svg>
                    </button>
                    <div class="volume-slider-box">
                        <input type="range" id="volume-slider" min="0" max="100" value="80" step="1"
                            title="Ajustar volumen" aria-label="Volumen">
                        <span id="volume-val">80%</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Contenedor Principal en 2 Columnas -->
        <main class="main-layout">
            <!-- Panel Lateral: Editor Directo de Opciones / Retos -->
            <section class="glass-card options-panel">
                <div class="panel-header">
                    <div class="panel-title-row">
                        <div class="panel-title">
                            <h2 id="panel-title-text" class="animated-panel-title">Retos</h2>
                        </div>
                        <span id="items-count-badge" class="badge">0 opciones</span>
                    </div>

                    <!-- Selector de Plantillas Deslizante -->
                    <div class="template-selector" id="template-selector">
                        <div class="template-indicator" id="template-indicator"></div>
                        <button id="tpl-retos-btn" class="tpl-btn active" onclick="loadTemplate('retos')" title="Cargar plantilla de Retos">Reto</button>
                        <button id="tpl-verdad-btn" class="tpl-btn" onclick="loadTemplate('verdad')" title="Cargar plantilla de Verdad">Verdad</button>
                    </div>
                </div>

                <!-- Cuadro de Edición Directo con soporte para tachado -->
                <div class="textarea-container">
                    <div id="options-editor" class="options-editor" contenteditable="true" spellcheck="false"
                        data-placeholder="Escribe o pega aquí tus opciones o retos...&#10;Una opción por cada línea (Enter)">
                    </div>
                </div>

                <!-- Acciones Rápidas -->
                <div class="list-actions">
                    <button class="text-btn highlight" onclick="shuffleItems()" title="Mezclar el orden aleatoriamente">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="16 3 21 3 21 8"></polyline>
                            <line x1="4" y1="20" x2="21" y2="3"></line>
                            <polyline points="21 16 21 21 16 21"></polyline>
                            <line x1="15" y1="15" x2="21" y2="21"></line>
                            <line x1="4" y1="4" x2="9" y2="9"></line>
                        </svg>
                        Mezclar
                    </button>
                    <button class="text-btn" onclick="sortItems()" title="Ordenar alfabéticamente o numéricamente">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M15 18l3-3 3 3M18 15v6M3 6h18M3 12h12M3 18h6" />
                        </svg>
                        Ordenar
                    </button>
                    <button class="text-btn" id="restore-btn" onclick="restoreStruckItems()"
                        title="Reactivar todas las opciones tachadas">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 4v6h6M23 20v-6h-6" />
                            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15" />
                        </svg>
                        Restaurar
                    </button>
                    <button class="text-btn danger" onclick="clearAllItems()" title="Borrar todo el texto">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                            </path>
                        </svg>
                        Limpiar
                    </button>
                </div>
            </section>

            <!-- Área Central: Escenario de la Ruleta -->
            <section class="wheel-stage">
                <div class="wheel-wrapper">
                    <!-- Flecha / Marcador -->
                    <div class="wheel-pointer">
                        <div class="pointer-arrow"></div>
                        <div class="pointer-glow"></div>
                    </div>

                    <!-- Halo de Luces Sutil -->
                    <div class="wheel-halo"></div>

                    <!-- Canvas de la Ruleta -->
                    <div class="canvas-container">
                        <canvas id="wheel" width="460" height="460"></canvas>
                    </div>
                </div>

                <!-- Botón de Giro -->
                <div class="spin-control">
                    <button id="spin-btn" class="spin-button" onclick="spin()">
                        <span class="btn-shine"></span>
                        <span class="btn-text">¡GIRAR RULETA!</span>
                        <svg class="spin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" />
                        </svg>
                    </button>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal de Ganador con 3 Acciones -->
    <div id="winner-modal" class="modal-overlay hidden">
        <div class="modal-content glass-card party-modal">
            <div class="winner-icon-box">
                <img src="badbunyfeliz.png" alt="Bad Bunny Feliz" class="winner-avatar-img">
            </div>
            <p class="winner-tag">¡RESULTADO GANADOR!</p>
            <h2 id="winner-title" class="winner-name">Opción</h2>

            <!-- 3 Opciones: Eliminar, Tachar opción, Siguiente turno -->
            <div class="modal-actions-grid">
                <button class="modal-action-btn danger-action" onclick="removeWinnerAndClose()"
                    title="Eliminar completamente de la lista">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    <span>Eliminar</span>
                </button>

                <button class="modal-action-btn strike-action" onclick="strikeWinnerAndClose()"
                    title="Tachar la opción: se queda en la lista pero no volverá a salir">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="4" y1="12" x2="20" y2="12"></line>
                        <path
                            d="M17.5 7.5c-.8-1.5-2.2-2.5-4.5-2.5-3.5 0-5 2-5 4 0 4.5 9.5 2.5 9.5 7 0 2.5-2 4-5 4-2.5 0-4.2-1.2-5-2.5">
                        </path>
                    </svg>
                    <span>Tachar opción</span>
                </button>

                <button class="modal-action-btn primary-action" onclick="closeWinnerModal()"
                    title="Continuar sin modificar la lista">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                    <span>Siguiente turno</span>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
